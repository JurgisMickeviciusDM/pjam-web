services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pjpassword}
      POSTGRES_DB: ${POSTGRES_DB:-pjam}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pj} -d ${POSTGRES_DB:-pjam}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pj}:${POSTGRES_PASSWORD:-pjpassword}@db:5432/${POSTGRES_DB:-pjam}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pjassetmanagement.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe!2026}
      DEMO_CLIENT_EMAIL: ${DEMO_CLIENT_EMAIL:-client@pjassetmanagement.com}
      DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD:-ClientDemo!2026}
      SEED_ON_START: ${SEED_ON_START:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CONTACT_TO: ${CONTACT_TO:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
